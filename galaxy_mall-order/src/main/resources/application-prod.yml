galaxy:
  order:
    messaging-backend: ${GALAXY_ORDER_MESSAGING_BACKEND:rocketmq}
    store-backend: ${GALAXY_ORDER_STORE_BACKEND:jdbc-sharded}
    rocketmq:
      topic: ${GALAXY_ORDER_ROCKETMQ_TOPIC:galaxy-order-submitted}
      consumer-group: ${GALAXY_ORDER_ROCKETMQ_CONSUMER_GROUP:galaxy-order-consumer}

services:
  product:
    url: ${SERVICES_PRODUCT_URL:http://galaxy-mall-product:8082}
  stock:
    url: ${SERVICES_STOCK_URL:http://galaxy-mall-stock:8083}
