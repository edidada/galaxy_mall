spring:
  application:
    name: galaxy-mall-order
  lifecycle:
    timeout-per-shutdown-phase: 30s
  cloud:
    nacos:
      discovery:
        enabled: ${NACOS_DISCOVERY_ENABLED:false}
        register-enabled: ${NACOS_DISCOVERY_REGISTER_ENABLED:${NACOS_DISCOVERY_ENABLED:false}}
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
    sentinel:
      enabled: ${SENTINEL_ENABLED:true}
      eager: true
      transport:
        dashboard: ${SENTINEL_DASHBOARD:}
        port: ${SENTINEL_TRANSPORT_PORT:8714}

server:
  port: 8084
  shutdown: graceful

rocketmq:
  name-server: ${ROCKETMQ_NAME_SERVER:127.0.0.1:9876}
  producer:
    group: ${ROCKETMQ_PRODUCER_GROUP:galaxy-order-producer}

galaxy:
  order:
    messaging-backend: ${GALAXY_ORDER_MESSAGING_BACKEND:local}
    store-backend: ${GALAXY_ORDER_STORE_BACKEND:local}
    rocketmq:
      topic: ${GALAXY_ORDER_ROCKETMQ_TOPIC:galaxy-order-submitted}
      consumer-group: ${GALAXY_ORDER_ROCKETMQ_CONSUMER_GROUP:galaxy-order-consumer}
    sharding:
      shard-count: ${GALAXY_ORDER_SHARD_COUNT:2}
      table-shards: ${GALAXY_ORDER_TABLE_SHARDS:4}
      shards:
        - url: ${ORDER_SHARD_0_URL:jdbc:mysql://127.0.0.1:3306/galaxy_order_0?useSSL=false&serverTimezone=UTC}
          username: ${ORDER_SHARD_0_USERNAME:root}
          password: ${ORDER_SHARD_0_PASSWORD:root}
        - url: ${ORDER_SHARD_1_URL:jdbc:mysql://127.0.0.1:3306/galaxy_order_1?useSSL=false&serverTimezone=UTC}
          username: ${ORDER_SHARD_1_USERNAME:root}
          password: ${ORDER_SHARD_1_PASSWORD:root}

seata:
  enabled: ${SEATA_ENABLED:false}
  application-id: ${spring.application.name}
  tx-service-group: ${SEATA_TX_SERVICE_GROUP:galaxy-mall-tx-group}
  service:
    vgroupMapping:
      galaxy-mall-tx-group: ${SEATA_VGROUP_MAPPING:default}
    grouplist:
      default: ${SEATA_SERVER_ADDR:127.0.0.1:8091}

dubbo:
  application:
    name: ${spring.application.name}
    qos-enable: false
    serialize-check-status: WARN
  protocol:
    name: tri
    port: ${DUBBO_PORT:20884}
  registry:
    address: ${DUBBO_REGISTRY_ADDRESS:N/A}
    register-mode: instance
    group: ${DUBBO_GROUP:galaxy-mall}
    parameters:
      namespace: ${NACOS_NAMESPACE:}
  consumer:
    check: false

management:
  endpoint:
    health:
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,sentinel
