---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
      - name: gateway
        image: docker.io/galaxy-mall/gateway:local
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "prod"
        - name: SERVICES_USER_URL
          value: "http://user:8080"
        - name: SERVICES_PRODUCT_URL
          value: "http://product:8080"
        - name: SERVICES_SECKILL_URL
          value: "http://seckill:8080"
        - name: SERVICES_STOCK_URL
          value: "http://stock:8080"
        - name: SERVICES_ORDER_URL
          value: "http://order:8080"
        - name: SERVICES_PAYMENT_URL
          value: "http://payment:8080"
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  labels:
    monitoring: galaxy-mall
spec:
  selector:
    app: gateway
  ports:
    - name: http
      port: 8080
      targetPort: 8080
  type: NodePort
