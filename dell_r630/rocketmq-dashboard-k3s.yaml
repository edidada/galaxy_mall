apiVersion: apps/v1
kind: Deployment
metadata:
  name: rocketmq-dashboard
  namespace: middleware
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rocketmq-dashboard
  template:
    metadata:
      labels:
        app: rocketmq-dashboard
    spec:
      containers:
        - name: dashboard
          image: apacherocketmq/rocketmq-dashboard:2.1.0
          imagePullPolicy: IfNotPresent
          env:
            - name: JAVA_OPTS
              value: "-Drocketmq.namesrv.addr=rocketmq-namesrv.middleware.svc.cluster.local:9876"
          ports:
            - containerPort: 8082
              name: http
          readinessProbe:
            tcpSocket:
              port: 8082
            initialDelaySeconds: 60
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8082
            initialDelaySeconds: 90
            periodSeconds: 20
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: rocketmq-dashboard
  namespace: middleware
spec:
  type: NodePort
  selector:
    app: rocketmq-dashboard
  ports:
    - name: http
      port: 8082
      targetPort: 8082
      nodePort: 30808
