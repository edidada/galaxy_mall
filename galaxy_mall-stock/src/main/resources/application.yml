spring:
  application:
    name: galaxy-mall-stock
  lifecycle:
    timeout-per-shutdown-phase: 30s
  autoconfigure:
    # 引入 spring-boot-starter-jdbc 后 DataSourceAutoConfiguration 会在无 spring.datasource.url
    # 且 classpath 无内嵌数据库时直接 fail-fast；库存账本是自己装配的 DataSource（StockServiceApplication），
    # 不需要这两条自动装配。注意 order 模块靠 runtime 依赖的 H2 兜底，这里显式排除。
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: ${REDIS_TIMEOUT:2s}

server:
  port: 8083
  shutdown: graceful

galaxy:
  stock:
    backend: ${GALAXY_STOCK_BACKEND:in-memory}
    local-rate-limit: ${GALAXY_STOCK_LOCAL_RATE_LIMIT:10000}
    # 库存“DB 账本”后端：local（每 Pod 内存，老 demo 行为）或 jdbc（MySQL t_stock_ledger，多副本一致）
    ledger-backend: ${GALAXY_STOCK_LEDGER_BACKEND:local}
    db:
      url: ${STOCK_DB_URL:jdbc:mysql://127.0.0.1:3306/galaxy_stock?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8}
      username: ${STOCK_DB_USERNAME:root}
      password: ${STOCK_DB_PASSWORD:root}

management:
  endpoint:
    health:
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
