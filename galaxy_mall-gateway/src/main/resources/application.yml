spring:
  application:
    name: galaxy-mall-gateway
  main:
    web-application-type: reactive
  lifecycle:
    timeout-per-shutdown-phase: 30s
  cloud:
    nacos:
      discovery:
        enabled: ${NACOS_DISCOVERY_ENABLED:false}
        register-enabled: ${NACOS_DISCOVERY_REGISTER_ENABLED:${NACOS_DISCOVERY_ENABLED:false}}
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
    sentinel:
      enabled: ${SENTINEL_ENABLED:true}
      eager: true
      transport:
        dashboard: ${SENTINEL_DASHBOARD:}
        port: ${SENTINEL_TRANSPORT_PORT:8710}
    gateway:
      filter:
        json-to-grpc:
          enabled: false

server:
  port: 8080
  shutdown: graceful

dubbo:
  application:
    name: ${spring.application.name}
    qos-enable: false
    serialize-check-status: WARN
  registry:
    address: ${DUBBO_REGISTRY_ADDRESS:N/A}
    register-mode: instance
    group: ${DUBBO_GROUP:galaxy-mall}
    parameters:
      namespace: ${NACOS_NAMESPACE:}
  consumer:
    check: false

galaxy:
  gateway:
    query:
      token-capacity: ${GALAXY_GATEWAY_QUERY_TOKEN_CAPACITY:10000}
      refill-per-second: ${GALAXY_GATEWAY_QUERY_REFILL_PER_SECOND:5000}
    order:
      token-capacity: ${GALAXY_GATEWAY_ORDER_TOKEN_CAPACITY:5000}
      refill-per-second: ${GALAXY_GATEWAY_ORDER_REFILL_PER_SECOND:2000}
      leaky-bucket-capacity: ${GALAXY_GATEWAY_ORDER_LEAKY_BUCKET_CAPACITY:1500}
      leaky-bucket-per-second: ${GALAXY_GATEWAY_ORDER_LEAKY_BUCKET_PER_SECOND:1000}
      user-window-limit: ${GALAXY_GATEWAY_USER_WINDOW_LIMIT:3}
    waiting-room:
      capacity: ${GALAXY_GATEWAY_WAITING_ROOM_CAPACITY:1000000}
      release-per-second: ${GALAXY_GATEWAY_WAITING_ROOM_RELEASE_PER_SECOND:100000}
management:
  endpoint:
    health:
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,sentinel
