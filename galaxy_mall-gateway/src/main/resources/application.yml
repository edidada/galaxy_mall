spring:
  application:
    name: galaxy-mall-gateway
  main:
    web-application-type: reactive
  cloud:
    gateway:
      filter:
        json-to-grpc:
          enabled: false

server:
  port: 8080

services:
  user:
    url: http://localhost:8081
  product:
    url: http://localhost:8082
  stock:
    url: http://localhost:8083
  order:
    url: http://localhost:8084
  payment:
    url: http://localhost:8085

management:
  endpoints:
    web:
      exposure:
        include: health,info
