services:
  user:
    url: ${SERVICES_USER_URL:http://galaxy-mall-user:8080}
  product:
    url: ${SERVICES_PRODUCT_URL:http://galaxy-mall-product:8080}
  stock:
    url: ${SERVICES_STOCK_URL:http://galaxy-mall-stock:8080}
  order:
    url: ${SERVICES_ORDER_URL:http://galaxy-mall-order:8080}
  payment:
    url: ${SERVICES_PAYMENT_URL:http://galaxy-mall-payment:8080}

galaxy:
  gateway:
    query:
      token-capacity: ${GALAXY_GATEWAY_QUERY_TOKEN_CAPACITY:20000}
      refill-per-second: ${GALAXY_GATEWAY_QUERY_REFILL_PER_SECOND:10000}
    order:
      token-capacity: ${GALAXY_GATEWAY_ORDER_TOKEN_CAPACITY:10000}
      refill-per-second: ${GALAXY_GATEWAY_ORDER_REFILL_PER_SECOND:5000}
      leaky-bucket-capacity: ${GALAXY_GATEWAY_ORDER_LEAKY_BUCKET_CAPACITY:3000}
      leaky-bucket-per-second: ${GALAXY_GATEWAY_ORDER_LEAKY_BUCKET_PER_SECOND:2000}
      user-window-limit: ${GALAXY_GATEWAY_USER_WINDOW_LIMIT:5}
    waiting-room:
      capacity: ${GALAXY_GATEWAY_WAITING_ROOM_CAPACITY:200000}
      release-per-second: ${GALAXY_GATEWAY_WAITING_ROOM_RELEASE_PER_SECOND:20000}
