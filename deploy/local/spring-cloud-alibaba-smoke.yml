spring:
  cloud:
    nacos:
      discovery:
        enabled: false
        register-enabled: false
    discovery:
      client:
        simple:
          instances:
            galaxy-mall-user:
              - uri: http://localhost:19081
            galaxy-mall-product:
              - uri: http://localhost:19082
            galaxy-mall-stock:
              - uri: http://localhost:19083
            galaxy-mall-order:
              - uri: http://localhost:19084
            galaxy-mall-payment:
              - uri: http://localhost:19085
            galaxy-mall-seckill:
              - uri: http://localhost:19086
