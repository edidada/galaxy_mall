spring:
  cloud:
    nacos:
      discovery:
        enabled: false
        register-enabled: false
    discovery:
      client:
        simple:
          instances:
            galaxy-mall-user:
              - uri: http://localhost:8081
            galaxy-mall-product:
              - uri: http://localhost:8082
            galaxy-mall-stock:
              - uri: http://localhost:8083
            galaxy-mall-order:
              - uri: http://localhost:8084
            galaxy-mall-payment:
              - uri: http://localhost:8085
            galaxy-mall-seckill:
              - uri: http://localhost:8086
