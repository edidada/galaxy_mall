apiVersion: v1
kind: Namespace
metadata:
  name: middleware
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: rocketmq-broker-config
  namespace: middleware
data:
  broker.conf: |
    brokerClusterName=galaxy-mall-rmq-cluster
    brokerName=broker-a
    brokerId=0
    deleteWhen=04
    fileReservedTime=48
    flushDiskType=ASYNC_FLUSH
    autoCreateTopicEnable=true
    autoCreateSubscriptionGroup=true
    listenPort=10911
    namesrvAddr=rocketmq-namesrv:9876
    storePathRootDir=/home/rocketmq/store
    storePathCommitLog=/home/rocketmq/store/commitlog
    storePathConsumeQueue=/home/rocketmq/store/consumequeue
    storePathIndex=/home/rocketmq/store/index
    storeCheckpoint=/home/rocketmq/store/checkpoint
    abortFile=/home/rocketmq/store/abort
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rocketmq-namesrv
  namespace: middleware
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rocketmq-namesrv
  template:
    metadata:
      labels:
        app: rocketmq-namesrv
    spec:
      containers:
        - name: namesrv
          image: apache/rocketmq:5.3.4
          imagePullPolicy: IfNotPresent
          command: ["./mqnamesrv"]
          ports:
            - containerPort: 9876
              name: namesrv
          readinessProbe:
            tcpSocket:
              port: 9876
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 9876
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: rocketmq-namesrv
  namespace: middleware
spec:
  selector:
    app: rocketmq-namesrv
  ports:
    - name: namesrv
      port: 9876
      targetPort: 9876
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rocketmq-broker
  namespace: middleware
spec:
  serviceName: rocketmq-broker
  replicas: 1
  selector:
    matchLabels:
      app: rocketmq-broker
  template:
    metadata:
      labels:
        app: rocketmq-broker
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: broker
          image: apache/rocketmq:5.3.4
          imagePullPolicy: IfNotPresent
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          command:
            - sh
            - -c
            - |
              cp /etc/rocketmq/broker.conf /tmp/broker.conf
              echo "brokerIP1=${POD_IP}" >> /tmp/broker.conf
              exec ./mqbroker -n rocketmq-namesrv:9876 -c /tmp/broker.conf
          ports:
            - containerPort: 10911
              name: remoting
            - containerPort: 10909
              name: ha
            - containerPort: 10912
              name: fast-remoting
          volumeMounts:
            - name: broker-config
              mountPath: /etc/rocketmq
            - name: broker-store
              mountPath: /home/rocketmq/store
          readinessProbe:
            tcpSocket:
              port: 10911
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 10911
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
      volumes:
        - name: broker-config
          configMap:
            name: rocketmq-broker-config
  volumeClaimTemplates:
    - metadata:
        name: broker-store
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: rocketmq-broker
  namespace: middleware
spec:
  clusterIP: None
  selector:
    app: rocketmq-broker
  ports:
    - name: remoting
      port: 10911
      targetPort: 10911
    - name: ha
      port: 10909
      targetPort: 10909
    - name: fast-remoting
      port: 10912
      targetPort: 10912
