apiVersion: v1
kind: Namespace
metadata:
  name: galaxy-mall-uat
---
apiVersion: v1
kind: Secret
metadata:
  name: galaxy-mall-uat-secrets
  namespace: galaxy-mall-uat
type: Opaque
stringData:
  REDIS_PASSWORD: ""
  ORDER_SHARD_0_PASSWORD: "change-me"
  ORDER_SHARD_1_PASSWORD: "change-me"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: galaxy-mall-uat-config
  namespace: galaxy-mall-uat
data:
  SPRING_PROFILES_ACTIVE: "uat"
  REDIS_HOST: "redis.uat.svc.cluster.local"
  REDIS_PORT: "6379"
  ROCKETMQ_NAME_SERVER: "rocketmq-namesrv.uat.svc.cluster.local:9876"
  SERVICES_USER_URL: "http://galaxy-mall-user:8081"
  SERVICES_PRODUCT_URL: "http://galaxy-mall-product:8082"
  SERVICES_STOCK_URL: "http://galaxy-mall-stock:8083"
  SERVICES_ORDER_URL: "http://galaxy-mall-order:8084"
  SERVICES_PAYMENT_URL: "http://galaxy-mall-payment:8085"
  GALAXY_STOCK_BACKEND: "redis"
  GALAXY_STOCK_LOCAL_RATE_LIMIT: "50000"
  GALAXY_ORDER_MESSAGING_BACKEND: "rocketmq"
  GALAXY_ORDER_STORE_BACKEND: "jdbc-sharded"
  GALAXY_ORDER_ROCKETMQ_TOPIC: "galaxy-order-submitted-uat"
  GALAXY_ORDER_ROCKETMQ_CONSUMER_GROUP: "galaxy-order-consumer-uat"
  ROCKETMQ_PRODUCER_GROUP: "galaxy-order-producer-uat"
  ORDER_SHARD_0_URL: "jdbc:mysql://mysql-order-0.uat.svc.cluster.local:3306/galaxy_order_0?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8"
  ORDER_SHARD_1_URL: "jdbc:mysql://mysql-order-1.uat.svc.cluster.local:3306/galaxy_order_1?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: galaxy-mall-gateway
  namespace: galaxy-mall-uat
spec:
  replicas: 2
  selector:
    matchLabels:
      app: galaxy-mall-gateway
  template:
    metadata:
      labels:
        app: galaxy-mall-gateway
    spec:
      containers:
        - name: gateway
          image: registry.example.com/galaxy-mall/gateway:uat
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: galaxy-mall-uat-config
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: galaxy-mall-gateway
  namespace: galaxy-mall-uat
spec:
  selector:
    app: galaxy-mall-gateway
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: galaxy-mall-user
  namespace: galaxy-mall-uat
spec:
  replicas: 1
  selector:
    matchLabels:
      app: galaxy-mall-user
  template:
    metadata:
      labels:
        app: galaxy-mall-user
    spec:
      containers:
        - name: user
          image: registry.example.com/galaxy-mall/user:uat
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef:
                name: galaxy-mall-uat-config
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8081
---
apiVersion: v1
kind: Service
metadata:
  name: galaxy-mall-user
  namespace: galaxy-mall-uat
spec:
  selector:
    app: galaxy-mall-user
  ports:
    - port: 8081
      targetPort: 8081
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: galaxy-mall-product
  namespace: galaxy-mall-uat
spec:
  replicas: 1
  selector:
    matchLabels:
      app: galaxy-mall-product
  template:
    metadata:
