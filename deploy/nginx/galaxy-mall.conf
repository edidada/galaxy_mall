worker_processes auto;

events {
    worker_connections 65535;
}

http {
    upstream galaxy_gateway {
        least_conn;
        server 127.0.0.1:8080 max_fails=3 fail_timeout=10s;
        server 127.0.0.1:8086 max_fails=3 fail_timeout=10s;
    }

    limit_req_zone $binary_remote_addr zone=per_ip_orders:20m rate=100r/s;
    limit_req_zone $server_name zone=global_gateway:50m rate=20000r/s;

    server {
        listen 80;
        server_name mall.example.com;

        location /api/gateway/orders {
            limit_req zone=per_ip_orders burst=200 nodelay;
            limit_req zone=global_gateway burst=20000 nodelay;
            proxy_pass http://galaxy_gateway;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Request-Id $request_id;
        }

        location / {
            proxy_pass http://galaxy_gateway;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Request-Id $request_id;
        }
    }
}
