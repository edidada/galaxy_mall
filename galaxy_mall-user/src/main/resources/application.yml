spring:
  application:
    name: galaxy-mall-user
  lifecycle:
    timeout-per-shutdown-phase: 30s
  autoconfigure:
    # 引入 spring-boot-starter-jdbc 后 DataSourceAutoConfiguration 会在无 spring.datasource.url
    # 且 classpath 无内嵌数据库时直接 fail-fast；用户存储是自己装配的 DataSource（UserStoreConfig），
    # 不需要这两条自动装配。
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration

server:
  port: 8081
  shutdown: graceful

galaxy:
  user:
    # 用户存储后端：local（内存，演示/单测默认）或 jdbc（MySQL t_user，库 galaxy_user）
    store-backend: ${GALAXY_USER_STORE_BACKEND:local}
    db:
      url: ${USER_DB_URL:jdbc:mysql://127.0.0.1:3306/galaxy_user?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8}
      username: ${USER_DB_USERNAME:root}
      password: ${USER_DB_PASSWORD:root}

management:
  endpoint:
    health:
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
