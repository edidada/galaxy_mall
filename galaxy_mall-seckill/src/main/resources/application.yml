spring:
  application:
    name: galaxy-mall-seckill
  lifecycle:
    timeout-per-shutdown-phase: 30s
  cloud:
    nacos:
      discovery:
        enabled: ${NACOS_DISCOVERY_ENABLED:false}
        register-enabled: ${NACOS_DISCOVERY_REGISTER_ENABLED:${NACOS_DISCOVERY_ENABLED:false}}
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
    sentinel:
      enabled: ${SENTINEL_ENABLED:true}
      eager: true
      transport:
        dashboard: ${SENTINEL_DASHBOARD:}
        port: ${SENTINEL_TRANSPORT_PORT:8716}

server:
  port: 8086
  shutdown: graceful

dubbo:
  application:
    name: ${spring.application.name}
    qos-enable: false
    serialize-check-status: WARN
  registry:
    address: ${DUBBO_REGISTRY_ADDRESS:N/A}
    register-mode: instance
    group: ${DUBBO_GROUP:galaxy-mall}
    parameters:
      namespace: ${NACOS_NAMESPACE:}
  consumer:
    check: false

galaxy:
  seckill:
    global-rate-limit: ${GALAXY_SECKILL_GLOBAL_RATE_LIMIT:20000}
    user-rate-limit: ${GALAXY_SECKILL_USER_RATE_LIMIT:1}
    ip-rate-limit: ${GALAXY_SECKILL_IP_RATE_LIMIT:10}
    worker-count: ${GALAXY_SECKILL_WORKER_COUNT:8}
    queue-capacity: ${GALAXY_SECKILL_QUEUE_CAPACITY:4096}
    refresh-interval-ms: ${GALAXY_SECKILL_REFRESH_INTERVAL_MS:100}
    product-cache-ttl-ms: ${GALAXY_SECKILL_PRODUCT_CACHE_TTL_MS:30000}
    terminal-retention-ms: ${GALAXY_SECKILL_TERMINAL_RETENTION_MS:300000}

management:
  endpoint:
    health:
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,sentinel
