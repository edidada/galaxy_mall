# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
    - name: Build with Maven
      # SpringCloudSmokeTest 是集成冒烟测试：在一个 JVM 里同时启动 6 个 Spring Boot 服务，
      # 依赖 MySQL / Redis / RocketMQ 等本地基础设施，GitHub Runner 上不具备这些能力（自 05 月起一直失败）。
      # 这里仅排除该集成测试，其余单元测试照常执行，避免有价值的单测被 -DskipTests 一并关掉。
      run: mvn -B -ntp package --file pom.xml -Dtest='!SpringCloudSmokeTest' -DfailIfNoTests=false

