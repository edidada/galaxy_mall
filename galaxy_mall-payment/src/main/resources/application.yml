spring:
  application:
    name: galaxy-mall-payment
  lifecycle:
    timeout-per-shutdown-phase: 30s
  autoconfigure:
    # 引入 spring-boot-starter-jdbc 后 DataSourceAutoConfiguration 会在无 spring.datasource.url
    # 且 classpath 无内嵌数据库时直接 fail-fast；支付流水是自己装配的 DataSource，
    # 不需要这两条自动装配（同 user/stock，与 order 靠 runtime H2 兜底的情况不同）。
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration
  cloud:
    openfeign:
      client:
        config:
          default:
            connectTimeout: ${GALAXY_PAYMENT_FEIGN_CONNECT_TIMEOUT_MS:1000}
            readTimeout: ${GALAXY_PAYMENT_FEIGN_READ_TIMEOUT_MS:3000}

server:
  port: 8085
  shutdown: graceful

galaxy:
  payment:
    # 支付流水落库：local（内存/不留流水，默认）或 jdbc（MySQL t_payment，库 galaxy_payment）
    store-backend: ${GALAXY_PAYMENT_STORE_BACKEND:local}
    db:
      url: ${PAYMENT_DB_URL:jdbc:mysql://127.0.0.1:3306/galaxy_payment?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8}
      username: ${PAYMENT_DB_USERNAME:root}
      password: ${PAYMENT_DB_PASSWORD:root}

services:
  order:
    url: ${SERVICES_ORDER_URL:http://localhost:8084}
  stock:
    url: ${SERVICES_STOCK_URL:http://localhost:8083}

seata:
  enabled: ${SEATA_ENABLED:false}
  application-id: ${spring.application.name}
  tx-service-group: ${SEATA_TX_SERVICE_GROUP:galaxy-mall-tx-group}
  service:
    vgroupMapping:
      galaxy-mall-tx-group: ${SEATA_VGROUP_MAPPING:default}
    grouplist:
      default: ${SEATA_SERVER_ADDR:127.0.0.1:8091}

management:
  endpoint:
    health:
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
