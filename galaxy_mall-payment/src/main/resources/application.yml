spring:
  application:
    name: galaxy-mall-payment
  lifecycle:
    timeout-per-shutdown-phase: 30s
  cloud:
    nacos:
      discovery:
        enabled: ${NACOS_DISCOVERY_ENABLED:false}
        register-enabled: ${NACOS_DISCOVERY_REGISTER_ENABLED:${NACOS_DISCOVERY_ENABLED:false}}
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
    sentinel:
      enabled: ${SENTINEL_ENABLED:true}
      eager: true
      transport:
        dashboard: ${SENTINEL_DASHBOARD:}
        port: ${SENTINEL_TRANSPORT_PORT:8715}

server:
  port: 8085
  shutdown: graceful

seata:
  enabled: ${SEATA_ENABLED:false}
  application-id: ${spring.application.name}
  tx-service-group: ${SEATA_TX_SERVICE_GROUP:galaxy-mall-tx-group}
  service:
    vgroupMapping:
      galaxy-mall-tx-group: ${SEATA_VGROUP_MAPPING:default}
    grouplist:
      default: ${SEATA_SERVER_ADDR:127.0.0.1:8091}

dubbo:
  application:
    name: ${spring.application.name}
    qos-enable: false
    serialize-check-status: WARN
  protocol:
    name: tri
    port: ${DUBBO_PORT:20885}
  registry:
    address: ${DUBBO_REGISTRY_ADDRESS:N/A}
    register-mode: instance
    group: ${DUBBO_GROUP:galaxy-mall}
    parameters:
      namespace: ${NACOS_NAMESPACE:}
  consumer:
    check: false

management:
  endpoint:
    health:
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,sentinel
