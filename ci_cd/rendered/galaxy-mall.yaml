        - name: order
          image: registry.127.0.0.1.nip.io/galaxy-mall/galaxy-mall/order:testtag
          ports:
            - containerPort: 8084
          envFrom:
            - configMapRef:
                name: galaxy-mall-config
            - secretRef:
                name: galaxy-mall-secrets
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8084
