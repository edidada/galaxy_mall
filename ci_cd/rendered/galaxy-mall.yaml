---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: galaxy-mall-gateway
  namespace: galaxy-mall
  annotations:
    kubernetes.io/ingress.class: traefik
spec:
  ingressClassName: traefik
  rules:
    - host: mall.127.0.0.1.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: galaxy-mall-gateway
                port:
                  number: 8080
