controller:
  admin:
    username: "admin"
    password: "ChangeMe_2026!"
  jenkinsUrl: "http://jenkins.127.0.0.1.nip.io"
  jenkinsAdminEmail: "root@127.0.0.1.nip.io"
  serviceType: ClusterIP
  ingress:
    enabled: true
    ingressClassName: traefik
    hostName: "jenkins.127.0.0.1.nip.io"
  installLatestPlugins: false
  installLatestSpecifiedPlugins: false
  containerEnv:
    - name: GITLAB_ROOT_USERNAME
      value: "root"
    - name: GITLAB_ROOT_TOKEN
      value: "glpat-bootstrap-2026-ChangeMe"
    - name: GITLAB_PROJECT_HTTP_URL
      value: "http://gitlab.127.0.0.1.nip.io/galaxy-mall/galaxy-mall.git"
    - name: GITLAB_REGISTRY_HOST
      value: "registry.127.0.0.1.nip.io"
    - name: JENKINS_WEBHOOK_TOKEN
      value: "galaxy-mall-webhook-2026"
    - name: GITLAB_DEFAULT_BRANCH
      value: "master"
  installPlugins:
    - kubernetes:4392.v19cea_fdb_5913
    - workflow-aggregator:608.v67378e9d3db_1
    - git:5.7.0
    - job-dsl:1.93
    - configuration-as-code:2074.va_57f83f7a_10b_
    - generic-webhook-trigger:2.4.1
    - credentials:1447.v4cb_b_539b_5321
    - credentials-binding:687.v619cb_15e923f
    - plain-credentials:195.vb_906e9073dee
  JCasC:
    defaultConfig: true
    configScripts:
      system-message: |
        jenkins:
          systemMessage: "Galaxy Mall Jenkins, managed by JCasC.\n"
          globalNodeProperties:
            - envVars:
                env:
                  - key: K3S_NODE_IP
                    value: "127.0.0.1"
                  - key: BASE_DOMAIN
                    value: "127.0.0.1.nip.io"
                  - key: APP_NAMESPACE
                    value: "galaxy-mall"
                  - key: MIDDLEWARE_NAMESPACE
                    value: "middleware"
                  - key: APP_IMAGE_REGISTRY
                    value: "registry.127.0.0.1.nip.io"
                  - key: APP_IMAGE_REPOSITORY
                    value: "galaxy-mall/galaxy-mall"
                  - key: MALL_HOST
                    value: "mall.127.0.0.1.nip.io"
                  - key: REDIS_PASSWORD
                    value: "ChangeMe_2026!"
                  - key: MYSQL_APP_PASSWORD
                    value: "ChangeMe_2026!"
      credentials: |
        credentials:
          system:
            domainCredentials:
              - credentials:
                  - usernamePassword:
                      id: "gitlab-http-credentials"
                      scope: GLOBAL
                      username: "${GITLAB_ROOT_USERNAME}"
                      password: "${GITLAB_ROOT_TOKEN}"
                      description: "GitLab HTTP checkout and API token"
                  - usernamePassword:
                      id: "gitlab-registry-credentials"
                      scope: GLOBAL
                      username: "${GITLAB_ROOT_USERNAME}"
                      password: "${GITLAB_ROOT_TOKEN}"
                      description: "GitLab registry push credential"
      jobs: |
        jobs:
          - script: >
              pipelineJob('galaxy-mall-delivery') {
                description('Build, push and deploy Galaxy Mall to k3s')
                definition {
                  cpsScm {
                    scm {
                      git {
                        remote {
                          url("${GITLAB_PROJECT_HTTP_URL}")
                          credentials('gitlab-http-credentials')
                        }
                        branch("*/${GITLAB_DEFAULT_BRANCH}")
                      }
                    }
                    scriptPath('ci_cd/pipeline/Jenkinsfile')
                  }
                }
                triggers {
                  genericTrigger {
                    genericVariables {
                      genericVariable {
                        key('ref')
                        value('$.ref')
                        expressionType('JSONPath')
                      }
                    }
                    token("${JENKINS_WEBHOOK_TOKEN}")
                    causeString('Triggered by GitLab push')
                    printContributedVariables(true)
                    printPostContent(false)
                    regexpFilterText('$ref')
                    regexpFilterExpression('refs/heads/${GITLAB_DEFAULT_BRANCH}')
                  }
                }
              }
agent:
  enabled: true
  image: "jenkins/inbound-agent"
  tag: "3345.v03dee9b_f88fc-6"
  workingDir: "/home/jenkins/agent"
rbac:
  create: true
persistence:
  enabled: true
  size: 30Gi
